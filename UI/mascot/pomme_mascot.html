<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomme — Interactive EVE Mascot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #1A0913;
      --bg-glow: #2D1022;
      --ruby-main: #E61C5D;
      --ruby-deep: #9E0B3B;
      --gold-crown: #FFB703;
      --gold-glow: #FFE082;
      --text-light: #FFF0F5;
      --font-title: 'Baloo 2', cursive, sans-serif;
      --font-body: 'Quicksand', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
      font-family: var(--font-body);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Showcase Container */
    .mascot-stage {
      position: relative;
      width: 380px;
      height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Dialogue Speech Bubble */
    .dialogue-bubble {
      position: absolute;
      top: 20px;
      background: rgba(255, 255, 255, 0.95);
      color: #3D0921;
      padding: 14px 22px;
      border-radius: 24px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 12px 32px rgba(230, 28, 93, 0.25);
      text-align: center;
      max-width: 280px;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 10;
    }

    .dialogue-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .dialogue-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.95) transparent;
    }

    /* Mascot Wrapper */
    .mascot-wrapper {
      position: relative;
      width: 240px;
      height: 260px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Drop Shadow */
    .mascot-shadow {
      position: absolute;
      bottom: 10px;
      width: 140px;
      height: 24px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 1;
    }

    /* SVG Character Styling */
    .mascot-svg {
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: visible;
      transform-origin: bottom center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Idle Breathing Physics */
    .idle-float {
      animation: pommeBreath 3.5s ease-in-out infinite;
    }

    @keyframes pommeBreath {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-10px) scale(0.98, 1.03); }
    }

    /* Impulsive Physics Animations */
    .anim-poke {
      animation: pommePoke 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes pommePoke {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.25, 0.75) translateY(20px); }
      60% { transform: scale(0.85, 1.15) translateY(-15px); }
      80% { transform: scale(1.05, 0.95) translateY(4px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    .anim-hop {
      animation: pommeHop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pommeHop {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      20% { transform: translateY(10px) scale(1.15, 0.85); }
      50% { transform: translateY(-50px) rotate(-8deg) scale(0.9, 1.1); }
      75% { transform: translateY(0) rotate(3deg) scale(1.05, 0.95); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    .anim-wiggle {
      animation: pommeWiggle 0.5s ease-in-out;
    }

    @keyframes pommeWiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg) scale(1.02); }
      40% { transform: rotate(10deg) scale(1.02); }
      60% { transform: rotate(-8deg); }
      80% { transform: rotate(5deg); }
    }

    /* Particles Container */
    .particles-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); }
    }

    /* Interactive Controls Deck */
    .control-panel {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 360px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: var(--text-light);
      padding: 10px 16px;
      border-radius: 16px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      background: rgba(230, 28, 93, 0.3);
      border-color: var(--ruby-main);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    /* Crown Glow State */
    .crown-glowing #crown-path {
      filter: drop-shadow(0 0 12px #FFB703);
      transition: filter 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="mascot-stage">
    
    <!-- Speech Dialogue -->
    <div class="dialogue-bubble" id="dialogue">Hi! I'm Pomme 👑</div>

    <!-- Mascot Wrapper -->
    <div class="mascot-wrapper" id="mascot-btn">
      <div class="mascot-shadow" id="shadow"></div>
      <div class="particles-layer" id="particles"></div>

      <!-- High Quality SVG Mascot -->
      <svg class="mascot-svg idle-float" id="pomme-svg" viewBox="0 0 200 220">
        <defs>
          <!-- Ruby Body Gradient -->
          <radialGradient id="rubyGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FF5388" />
            <stop offset="55%" stop-color="#E61C5D" />
            <stop offset="85%" stop-color="#A80B3A" />
            <stop offset="100%" stop-color="#5E021E" />
          </radialGradient>

          <!-- Crown Gold Gradient -->
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFE082" />
            <stop offset="50%" stop-color="#FFB703" />
            <stop offset="100%" stop-color="#D48800" />
          </linearGradient>

          <!-- Specular Highlight Gradient -->
          <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </linearGradient>

          <!-- Subtle Glow Filter -->
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Base Body (Squishy Pomegranate Seed Shape) -->
        <path id="body-path" d="M 100,38 C 150,38 182,72 182,122 C 182,170 148,196 100,196 C 52,196 18,170 18,122 C 18,72 50,38 100,38 Z" fill="url(#rubyGrad)" />

        <!-- High Gloss Specular Reflection (Top Left) -->
        <path d="M 68,52 C 92,44 125,48 138,58 C 122,54 85,55 60,78 C 54,70 58,58 68,52 Z" fill="url(#glossGrad)" opacity="0.8" />
        <ellipse cx="50" cy="92" rx="8" ry="16" fill="url(#glossGrad)" transform="rotate(-25 50 92)" opacity="0.5" />

        <!-- Crown Calyx Top -->
        <g id="crown-group">
          <!-- Calyx Leaves -->
          <path id="crown-path" d="M 72,42 L 62,18 L 82,30 L 100,12 L 118,30 L 138,18 L 128,42 Z" fill="url(#goldGrad)" stroke="#B37200" stroke-width="2" stroke-linejoin="round" />
          <!-- Crown Center Seed Gem -->
          <circle cx="100" cy="28" r="4" fill="#E61C5D" />
        </g>

        <!-- Cute Cheeks / Blush -->
        <ellipse cx="52" cy="132" rx="12" ry="7" fill="#FF80AB" opacity="0.5" />
        <ellipse cx="148" cy="132" rx="12" ry="7" fill="#FF80AB" opacity="0.5" />

        <!-- Pupil / Eyes Layer (Dynamically Moved via JS) -->
        <g id="eyes-group">
          <!-- Left Eye -->
          <g id="eye-left" transform="translate(68, 112)">
            <ellipse class="eye-bg" cx="0" cy="0" rx="11" ry="15" fill="#240312" />
            <circle class="pupil" cx="-2" cy="-3" r="4.5" fill="#FFFFFF" />
            <circle class="pupil-sparkle" cx="3" cy="4" r="2" fill="#FFFFFF" />
          </g>

          <!-- Right Eye -->
          <g id="eye-right" transform="translate(132, 112)">
            <ellipse class="eye-bg" cx="0" cy="0" rx="11" ry="15" fill="#240312" />
            <circle class="pupil" cx="-2" cy="-3" r="4.5" fill="#FFFFFF" />
            <circle class="pupil-sparkle" cx="3" cy="4" r="2" fill="#FFFFFF" />
          </g>
        </g>

        <!-- Mouth Expressions (Path Swapped via JS) -->
        <path id="mouth" d="M 88,138 Q 100,150 112,138" stroke="#240312" stroke-width="3.5" fill="none" stroke-linecap="round" />

        <!-- Little Floating Feet/Base Accent -->
        <ellipse cx="78" cy="194" rx="10" ry="4" fill="#7A0529" />
        <ellipse cx="122" cy="194" rx="10" ry="4" fill="#7A0529" />
      </svg>
    </div>

    <!-- Interactive Deck -->
    <div class="control-panel">
      <button class="action-btn" onclick="triggerImpulse('poke')">👉 Poke</button>
      <button class="action-btn" onclick="triggerImpulse('hop')">🚀 Impulsive Hop</button>
      <button class="action-btn" onclick="triggerImpulse('love')">💖 Show Love</button>
      <button class="action-btn" onclick="triggerImpulse('insight')">👑 Cycle Nudge</button>
    </div>

  </div>

  <script>
    const pommeSvg = document.getElementById('pomme-svg');
    const mascotBtn = document.getElementById('mascot-btn');
    const shadow = document.getElementById('shadow');
    const dialogue = document.getElementById('dialogue');
    const mouth = document.getElementById('mouth');
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const particlesContainer = document.getElementById('particles');

    let dialogueTimeout;

    // Expression Mouth Shapes (SVG Paths)
    const mouthPaths = {
      happy: "M 88,138 Q 100,152 112,138",
      surprised: "M 94,142 A 6,7 0 1,0 106,142 A 6,7 0 1,0 94,142",
      excited: "M 86,136 Q 100,158 114,136 Z",
      wise: "M 90,140 Q 100,146 110,140"
    };

    // Show Bubble Dialogue
    function speak(text, duration = 2500) {
      dialogue.innerText = text;
      dialogue.classList.add('visible');
      clearTimeout(dialogueTimeout);
      dialogueTimeout = setTimeout(() => {
        dialogue.classList.remove('visible');
      }, duration);
    }

    // Pupil Mouse Tracking (Eye Gaze)
    document.addEventListener('mousemove', (e) => {
      const rect = mascotBtn.getBoundingClientRect();
      const mascotCenterX = rect.left + rect.width / 2;
      const mascotCenterY = rect.top + rect.height / 2;

      const angle = Math.atan2(e.clientY - mascotCenterY, e.clientX - mascotCenterX);
      const dist = Math.min(4, Math.hypot(e.clientX - mascotCenterX, e.clientY - mascotCenterY) / 30);

      const offsetX = Math.cos(angle) * dist;
      const offsetY = Math.sin(angle) * dist;

      eyeLeft.setAttribute('transform', `translate(${68 + offsetX}, ${112 + offsetY})`);
      eyeRight.setAttribute('transform', `translate(${132 + offsetX}, ${112 + offsetY})`);
    });

    // Particle Emitter (Hearts, Ruby Seeds, Sparkles)
    function spawnParticles(type = 'seed', count = 6) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        
        const dx = (Math.random() - 0.5) * 120 + 'px';
        const dy = -(Math.random() * 80 + 40) + 'px';
        p.style.setProperty('--dx', dx);
        p.style.setProperty('--dy', dy);
        p.style.left = '50%';
        p.style.top = '50%';

        if (type === 'heart') {
          p.innerText = '💖';
          p.style.fontSize = '18px';
        } else if (type === 'gold') {
          p.innerText = '✨';
          p.style.fontSize = '16px';
        } else {
          p.innerText = '💎';
          p.style.fontSize = '14px';
        }

        particlesContainer.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    // Reset Animation Classes
    function resetAnimations() {
      pommeSvg.classList.remove('anim-poke', 'anim-hop', 'anim-wiggle', 'idle-float', 'crown-glowing');
      shadow.style.transform = 'scale(1)';
      shadow.style.opacity = '1';
    }

    // Impulsive Action Controller
    function triggerImpulse(action) {
      resetAnimations();
      void pommeSvg.offsetWidth; // Trigger Reflow

      if (action === 'poke') {
        pommeSvg.classList.add('anim-poke');
        mouth.setAttribute('d', mouthPaths.surprised);
        speak("Hey! That tickles! 🍓");
        spawnParticles('seed', 5);

        setTimeout(() => {
          mouth.setAttribute('d', mouthPaths.happy);
          pommeSvg.classList.add('idle-float');
        }, 500);

      } else if (action === 'hop') {
        pommeSvg.classList.add('anim-hop');
        mouth.setAttribute('d', mouthPaths.excited);
        speak("Woohoo! Feeling high energy today! ⚡");
        spawnParticles('gold', 8);

        shadow.style.transform = 'scale(0.5)';
        shadow.style.opacity = '0.3';

        setTimeout(() => {
          mouth.setAttribute('d', mouthPaths.happy);
          pommeSvg.classList.add('idle-float');
          shadow.style.transform = 'scale(1)';
          shadow.style.opacity = '1';
        }, 600);

      } else if (action === 'love') {
        pommeSvg.classList.add('anim-wiggle');
        mouth.setAttribute('d', mouthPaths.happy);
        speak("You're doing great today! 💕");
        spawnParticles('heart', 7);

        setTimeout(() => {
          pommeSvg.classList.add('idle-float');
        }, 500);

      } else if (action === 'insight') {
        pommeSvg.classList.add('crown-glowing', 'idle-float');
        mouth.setAttribute('d', mouthPaths.wise);
        speak("Luteal phase detected: Time for iron-rich meals & soft recovery 👑", 3500);
        spawnParticles('gold', 10);
      }
    }

    // Click Mascot Directly
    mascotBtn.addEventListener('click', () => {
      const actions = ['poke', 'hop', 'love'];
      const randomAction = actions[Math.floor(Math.random() * actions.length)];
      triggerImpulse(randomAction);
    });

    // Initial Welcome
    setTimeout(() => {
      speak("Hi! I'm Pomme 👑 Tap me!");
    }, 600);
  </script>
</body>
</html>
