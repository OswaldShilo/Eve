<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomme — 5-Stage Top Peeled Mascot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #FFFFFF;
      --ruby-main: #E6195E;
      --ruby-dark: #2A000E;
      --ruby-blush: #FFA0B8;
      --ruby-soft: #FFF0F4;
      --text-dark: #2A000E;
      --font-display: 'Fredoka', sans-serif;
      --font-body: 'Quicksand', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-light);
      font-family: var(--font-body);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px 0;
    }

    .stage-container {
      position: relative;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Speech Bubble */
    .speech-bubble {
      position: relative;
      background: #FFFFFF;
      color: var(--ruby-dark);
      padding: 14px 22px;
      border-radius: 22px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.98rem;
      line-height: 1.35;
      letter-spacing: 0.2px;
      border: 3.5px solid var(--ruby-dark);
      box-shadow: 0 8px 0px var(--ruby-dark);
      text-align: center;
      min-width: 180px;
      max-width: 320px;
      width: max-content;
      z-index: 20;
      transform-origin: bottom center;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
      word-wrap: break-word;
      margin-bottom: 12px;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: var(--ruby-dark) transparent;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 7px 0;
      border-style: solid;
      border-color: #FFFFFF transparent;
      z-index: 1;
    }

    /* Mascot Container */
    .mascot-container {
      position: relative;
      width: 290px;
      height: 310px;
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mascot-container:active {
      cursor: grabbing;
    }

    .mascot-shadow {
      position: absolute;
      bottom: 8px;
      width: 150px;
      height: 22px;
      background: rgba(42, 0, 14, 0.14);
      border-radius: 50%;
      transition: transform 0.1s ease, opacity 0.1s ease;
      z-index: 1;
    }

    .mascot-svg {
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: visible;
      transform-origin: 50% 85%;
      will-change: transform;
    }

    /* Dark Aura */
    .dark-aura {
      position: absolute;
      width: 270px;
      height: 270px;
      background: radial-gradient(circle, rgba(230, 25, 94, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 0;
      pointer-events: none;
    }

    .dark-aura.active {
      opacity: 1;
      animation: pulseAura 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulseAura {
      from { transform: scale(0.95); opacity: 0.25; }
      to { transform: scale(1.18); opacity: 0.55; }
    }

    /* 5-Stage Top Peel Controller Card */
    .peel-control-card {
      width: 100%;
      max-width: 360px;
      background: #FFF5F8;
      border: 3.5px solid var(--ruby-dark);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 6px 0px var(--ruby-dark);
      margin-top: 14px;
      z-index: 10;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-family: var(--font-display);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ruby-dark);
    }

    .peel-badge {
      background: var(--ruby-main);
      color: #FFFFFF;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 2px solid var(--ruby-dark);
    }

    /* Stage Selector Stepper Buttons */
    .stage-stepper {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
    }

    .btn-stage {
      background: #FFFFFF;
      border: 2.5px solid var(--ruby-dark);
      color: var(--ruby-dark);
      padding: 8px 0;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0px var(--ruby-dark);
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .btn-stage span {
      font-size: 0.68rem;
      opacity: 0.8;
    }

    .btn-stage:hover {
      background: #FFE0EC;
      transform: translateY(-2px);
      box-shadow: 0 5px 0px var(--ruby-dark);
    }

    .btn-stage.active {
      background: var(--ruby-main);
      color: #FFFFFF;
      transform: translateY(2px);
      box-shadow: 0 1px 0px var(--ruby-dark);
    }

    .btn-stage.active span {
      color: #FFFFFF;
      opacity: 1;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-top: 12px;
      z-index: 10;
    }

    .btn-persona {
      background: #FFF5F8;
      border: 3.5px solid var(--ruby-dark);
      color: var(--ruby-dark);
      padding: 10px 12px;
      border-radius: 16px;
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 0px var(--ruby-dark);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .btn-persona.full-width {
      grid-column: span 2;
      background: var(--ruby-soft);
    }

    .btn-persona:hover {
      background: #FFE0EC;
      transform: translateY(-2px);
      box-shadow: 0 7px 0px var(--ruby-dark);
    }

    .btn-persona:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0px var(--ruby-dark);
    }

    /* Particles */
    .confetti-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    .particle {
      position: absolute;
      animation: popUp 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes popUp {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg); }
    }

    /* SVG Smooth Transitions */
    .peel-transition {
      transition: d 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }

    .seed-node {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .seed-node:hover {
      transform: scale(1.22);
    }
  </style>
</head>
<body>

        <!-- Base Body Shadow Crescent -->

        <!-- ========================================================= -->
        <!-- TOP REVEAL SEED CAVITY (Peels from top inside body cavity) -->

        <g id="top-peel-reservoir">

          <path id="top-cream-pith" class="peel-transition" d="M 70,44 Q 100,50 130,44 Q 100,56 70,44 Z" fill="#FFF2F5" opacity="0.9" />

          <!-- EXPOSED RUBY SEEDS IN TOP CAVITY (Revealed Tier by Tier) -->
          <g id="top-seed-rows">
            <!-- Row 1: Topmost Seeds (Always visible in small crown) -->
            <g id="seed-row-1" transform-origin="100 36">
              <g class="seed-node" onclick="tapSeed('Top Seed: Fresh vitality!')" transform-origin="84 32">

              </g>
              <g class="seed-node" onclick="tapSeed('Stage 2 Seed: Energy surge!')" transform-origin="112 46">

            <!-- Row 3: Revealed at Stage 3 (20% Top Peel) -->

              <g class="seed-node" onclick="tapSeed('Stage 3 Seed: Deep nourishment!')" transform-origin="76 56">
                <path d="M 76,52 C 68,44 80,38 85,46 C 88,52 82,58 76,52 Z" fill="#FF2A6D" stroke="#2A000E" stroke-width="2" />

                <path d="M 124,52 C 118,58 112,52 115,46 C 120,38 132,44 124,52 Z" fill="#D9004C" stroke="#2A000E" stroke-width="2" />

            <!-- Row 4: Revealed at Stage 4 (30% Top Peel) -->
            <g id="seed-row-4" class="peel-transition" style="opacity: 0; transform: translateY(-16px) scale(0.85);" transform-origin="100 68">

            <!-- Row 5: Revealed at Stage 5 (40% Deep Top Peel) -->
            <g id="seed-row-5" class="peel-transition" style="opacity: 0; transform: translateY(-20px) scale(0.85);" transform-origin="100 80">

                <circle cx="125" cy="68" r="1.8" fill="#FFFFFF" />

            </g>
          </g>
        </g>

        <!-- TOP ORGANIC TORN PEEL CROWN (Folds/Curled outward as peel deepens down) -->
        <g id="peel-crown-group" class="peel-transition" transform-origin="100 42">
          <!-- Back Peel Flaps -->
          <path id="crown-back-left" class="peel-transition" d="M 68,44 Q 60,26 74,32 Q 88,38 92,44 Z" fill="#C80042" stroke="#2A000E" stroke-width="3.5" stroke-linejoin="round" />
          <path id="crown-back-right" class="peel-transition" d="M 132,44 Q 140,26 126,32 Q 112,38 108,44 Z" fill="#C80042" stroke="#2A000E" stroke-width="3.5" stroke-linejoin="round" />
          
          <!-- Front Peel Flaps (Curled open from top) -->
          <path id="crown-front-left" class="peel-transition" d="M 60,48 Q 48,30 68,36 Q 80,40 84,52 Z" fill="#FF2A6D" stroke="#2A000E" stroke-width="3.5" stroke-linejoin="round" />

        <!-- Left Eye Container -->

          <g clip-path="url(#rightEyeClip)">

        <path id="mouth" d="M 86,140 Q 100,156 114,140" stroke="#2A000E" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- 5-Stage Stepper Control Card -->
    <div class="peel-control-card">
      <div class="card-header">
        <span class="card-title" id="stage-title">Top Peel Level: Stage 1</span>
        <span class="peel-badge" id="skin-badge">100% Skin</span>
      </div>
      
      <div class="stage-stepper">
        <button class="btn-stage active" onclick="setPeelStage(1)" id="stage-btn-1">
          S1 <span>100%</span>
        </button>
        <button class="btn-stage" onclick="setPeelStage(2)" id="stage-btn-2">
          S2 <span>90%</span>
        </button>

          S3 <span>80%</span>

        <button class="btn-stage" onclick="setPeelStage(4)" id="stage-btn-4">

    <!-- Controls Grid -->

      <button class="btn-persona" onclick="setEmotion('guilt')">Guilt Trip</button>

      <button class="btn-persona" onclick="setEmotion('sassy')">Sassy</button>

      <button class="btn-persona full-width" onclick="setEmotion('fertile')">🌸 Fertile Window Bloom</button>
    </div>

  </div>

  <script>
    // Rigging Elements
    const pommeRig = document.getElementById('pomme-rig');
    const mascotBox = document.getElementById('mascot-box');
    const shadow = document.getElementById('shadow');
    const speech = document.getElementById('speech');
    const aura = document.getElementById('aura');
    const confettiContainer = document.getElementById('confetti');

    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');
    const eyelidLeft = document.getElementById('eyelid-left');
    const eyelidRight = document.getElementById('eyelid-right');
    const browLeft = document.getElementById('brow-left');
    const browRight = document.getElementById('brow-right');
    const mouth = document.getElementById('mouth');
    const armLeftGroup = document.getElementById('arm-left-group');
    const armRightGroup = document.getElementById('arm-right-group');
    const fertileGlow = document.getElementById('fertile-glow');

    // Dynamic Top Peel Stage Elements
    const topPithLiner = document.getElementById('top-pith-liner');
    const topCreamPith = document.getElementById('top-cream-pith');
    const peelCrownGroup = document.getElementById('peel-crown-group');
    
    const seedRow2 = document.getElementById('seed-row-2');
    const seedRow3 = document.getElementById('seed-row-3');
    const seedRow4 = document.getElementById('seed-row-4');
    const seedRow5 = document.getElementById('seed-row-5');

    const stageTitle = document.getElementById('stage-title');
    const skinBadge = document.getElementById('skin-badge');

    // Stage Configurations (5 Discrete Depreciating 10% Peel Stages from Top)
    const stageConfigs = {
      1: {
        skin: "100% Skin",
        title: "Stage 1: Closed Top Crown",
        speech: "Stage 1: 100% Skin — Whole, intact & cozy!",
        linerD: "M 68,44 Q 100,48 132,44 Q 100,52 68,44 Z",
        creamD: "M 70,44 Q 100,50 130,44 Q 100,56 70,44 Z",
        crownTransform: "translate(0, 0) scale(1)",
        rows: [false, false, false, false]
      },
      2: {
        skin: "90% Skin",
        title: "Stage 2: Top Opening (10% Peel)",
        speech: "Stage 2: 90% Skin — Crown easing open, first seeds peeking!",
        linerD: "M 64,44 Q 100,56 136,44 Q 100,64 64,44 Z",
        creamD: "M 66,44 Q 100,58 134,44 Q 100,68 66,44 Z",
        crownTransform: "translate(0, 4px) scale(1.03)",
        rows: [true, false, false, false]
      },
      3: {
        skin: "80% Skin",
        title: "Stage 3: Mid-Top Peel (20% Peel)",
        speech: "Stage 3: 80% Skin — Rind dipping lower, 3 rows of ruby seeds revealed!",
        linerD: "M 60,44 Q 100,66 140,44 Q 100,76 60,44 Z",
        creamD: "M 62,44 Q 100,68 138,44 Q 100,80 62,44 Z",
        crownTransform: "translate(0, 8px) scale(1.06)",
        rows: [true, true, false, false]
      },
      4: {
        skin: "70% Skin",
        title: "Stage 4: Deep Top Peel (30% Peel)",
        speech: "Stage 4: 70% Skin — Crown folding down, rich seed cluster exposed!",
        linerD: "M 56,44 Q 100,76 144,44 Q 100,86 56,44 Z",
        creamD: "M 58,44 Q 100,78 142,44 Q 100,90 58,44 Z",
        crownTransform: "translate(0, 12px) scale(1.09)",
        rows: [true, true, true, false]
      },
      5: {
        skin: "60% Skin",
        title: "Stage 5: Full Top Reservoir (40% Peel)",
        speech: "Stage 5: 60% Skin — Maximum top peel! Fully bloomed ruby chamber!",
        linerD: "M 52,44 Q 100,86 148,44 Q 100,98 52,44 Z",
        creamD: "M 54,44 Q 100,88 146,44 Q 100,102 54,44 Z",
        crownTransform: "translate(0, 16px) scale(1.12)",
        rows: [true, true, true, true]
      }
    };

    let currentStage = 1;

    function setPeelStage(stage) {
      currentStage = stage;
      const config = stageConfigs[stage];

      // Update UI Stepper state
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`stage-btn-${i}`);
        if (i === stage) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }

      // Update Header Text & Badge
      stageTitle.innerText = config.title;
      skinBadge.innerText = config.skin;

      // Smooth SVG Geometry Morph for Top Peel Cavity
      topPithLiner.setAttribute('d', config.linerD);
      topCreamPith.setAttribute('d', config.creamD);
      peelCrownGroup.style.transform = config.crownTransform;

      // Toggle Seed Row Visibility & Vertical Slide
      const rows = [seedRow2, seedRow3, seedRow4, seedRow5];
      config.rows.forEach((visible, idx) => {
        if (visible) {
          rows[idx].style.opacity = '1';
          rows[idx].style.transform = 'translateY(0px) scale(1)';
        } else {
          rows[idx].style.opacity = '0';
          rows[idx].style.transform = `translateY(-${(idx + 2) * 4}px) scale(0.85)`;
        }
      });

      speak(config.speech);
      spawnConfetti(stage * 3);
    }

    // Mouth Shape Library
    const mouthShapes = {
      happy: "M 86,140 Q 100,156 114,140",
      openSmile: "M 84,138 Q 100,166 116,138 Z",
      flat: "M 88,144 L 112,144",
      smirk: "M 88,144 Q 100,148 114,138",
      shock: "M 92,142 A 8,10 0 1,0 108,142 A 8,10 0 1,0 92,142"
    };

    // Elastic Physics & Life Engine Variables
    let isDragging = false;
    let currentEmotion = null;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    const k = 0.14;
    const damping = 0.74;
    let vx = 0, vy = 0;

    // Smooth Eye LERP Tracking
    let targetPupilX = 0, targetPupilY = 0;
    let currentPupilX = 0, currentPupilY = 0;
    let idleTimer = 0;

    function physicsLoop() {
      idleTimer += 0.04;

      if (!isDragging) {
        // Organic Breathing & Micro Motion
        const breathY = Math.sin(idleTimer * 2) * 1.6;
        const breathX = Math.cos(idleTimer) * 0.6;

        let forceX = (0 - currentX) * k;
        let forceY = (0 - currentY) * k;

        vx = (vx + forceX) * damping;
        vy = (vy + forceY) * damping;

        currentX += vx;
        currentY += vy;

        const activeX = currentX + breathX;
        const activeY = currentY + breathY;

        const stretchX = 1 - (activeY * 0.003) + (Math.abs(activeX) * 0.002);
        const stretchY = 1 + (activeY * 0.003) - (Math.abs(activeX) * 0.002);
        const rotation = activeX * 0.15;

        pommeRig.style.transform = `translate(${activeX}px, ${activeY}px) scale(${stretchX}, ${stretchY}) rotate(${rotation}deg)`;

        // Arm sway life animation (if not performing emotion pose)
        if (!currentEmotion) {
          const armSwayLeft = Math.sin(idleTimer * 1.8) * 3;
          const armSwayRight = -Math.sin(idleTimer * 1.8) * 3;
          armLeftGroup.style.transform = `rotate(${armSwayLeft}deg)`;
          armRightGroup.style.transform = `rotate(${armSwayRight}deg)`;
        }

        // Shadow physics
        shadow.style.transform = `scale(${1 - activeY * 0.002}) translate(${activeX * 0.5}px, 0)`;
        shadow.style.opacity = `${0.6 - activeY * 0.003}`;
      }

      // Smooth LERP Pupil Tracking
      currentPupilX += (targetPupilX - currentPupilX) * 0.12;
      currentPupilY += (targetPupilY - currentPupilY) * 0.12;

      pupilLeft.setAttribute('transform', `translate(68, 115) translate(${currentPupilX}, ${currentPupilY})`);
      pupilRight.setAttribute('transform', `translate(132, 115) translate(${currentPupilX}, ${currentPupilY})`);

      requestAnimationFrame(physicsLoop);
    }
    physicsLoop();

    // Tap Individual Exposed Seed Action
    function tapSeed(message) {
      speak(message);
      spawnConfetti(8);
    }

    // Mouse & Touch Drag Handlers
    mascotBox.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    mascotBox.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY));
    window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX, e.touches[0].clientY));
    window.addEventListener('touchend', endDrag);

    function startDrag(x, y) {
      isDragging = true;
      startX = x - currentX;
      startY = y - currentY;
      eyelidLeft.setAttribute('transform', 'translate(0, -10)');
      eyelidRight.setAttribute('transform', 'translate(0, -10)');
      mouth.setAttribute('d', mouthShapes.shock);
      speak("SQUISH! Watch my top seeds!");
    }

    function moveDrag(x, y) {
      if (!isDragging) return;
      currentX = x - startX;
      currentY = y - startY;

      const angle = Math.atan2(currentY, currentX);
      const dist = Math.min(6, Math.hypot(currentX, currentY) / 10);
      targetPupilX = Math.cos(angle) * dist;
      targetPupilY = Math.sin(angle) * dist;
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      eyelidLeft.setAttribute('transform', 'translate(0, -34)');
      eyelidRight.setAttribute('transform', 'translate(0, -34)');
      mouth.setAttribute('d', mouthShapes.happy);
      speak("Boing! Soft, squishy & intact!");
      spawnConfetti(6);
    }

    // Eye Tracking
    document.addEventListener('mousemove', (e) => {
      if (isDragging) return;
      const rect = mascotBox.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const angle = Math.atan2(dy, dx);
      const dist = Math.min(6, Math.hypot(dx, dy) / 35);

      targetPupilX = Math.cos(angle) * dist;
      targetPupilY = Math.sin(angle) * dist;
    });

    // Random Blinking
    function blinkLoop() {
      if (!isDragging) {
        eyelidLeft.setAttribute('transform', 'translate(0, 0)');
        eyelidRight.setAttribute('transform', 'translate(0, 0)');
        setTimeout(() => {
          eyelidLeft.setAttribute('transform', 'translate(0, -34)');
          eyelidRight.setAttribute('transform', 'translate(0, -34)');
        }, 140);
      }
      setTimeout(blinkLoop, Math.random() * 3800 + 2200);
    }
    blinkLoop();

    // Speech Controller
    function speak(text) {
      speech.innerText = text;
      speech.style.transform = "scale(1.08)";
      setTimeout(() => speech.style.transform = "scale(1)", 150);
    }

    // Vector Particle Generator
    function spawnConfetti(count = 12) {
      const palette = ['#FF2A6D', '#FF8CAE', '#2A000E', '#FFD1DC', '#E6195E', '#FF5E8E'];
      
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.floor(Math.random() * 8 + 6);
        const shapeType = Math.floor(Math.random() * 3);

        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = palette[Math.floor(Math.random() * palette.length)];
        p.style.left = '50%';
        p.style.top = '50%';

        if (shapeType === 0) {
          p.style.borderRadius = '50%';
        } else if (shapeType === 1) {
          p.style.transform = 'rotate(45deg)';
        } else {
          p.style.borderRadius = '2px';
        }
        
        const dx = (Math.random() - 0.5) * 200 + 'px';
        const dy = -(Math.random() * 130 + 60) + 'px';
        p.style.setProperty('--dx', dx);
        p.style.setProperty('--dy', dy);

        confettiContainer.appendChild(p);
        setTimeout(() => p.remove(), 850);
      }
    }

    // Emotion System
    function setEmotion(type) {
      aura.classList.remove('active');
      fertileGlow.style.opacity = "0";
      currentEmotion = type;

      if (type === 'guilt') {
        aura.classList.add('active');
        browLeft.setAttribute('d', "M 54,86 L 80,96");
        browRight.setAttribute('d', "M 120,96 L 146,86");
        eyelidLeft.setAttribute('transform', 'translate(0, -18)');
        eyelidRight.setAttribute('transform', 'translate(0, -18)');
        mouth.setAttribute('d', mouthShapes.flat);
        armLeftGroup.style.transform = "rotate(-40deg) translate(-5px, -5px)";
        armRightGroup.style.transform = "rotate(40deg) translate(5px, -5px)";

        speak("You missed your symptom check-in today... Pomme is watching.");

      } else if (type === 'hype') {
        browLeft.setAttribute('d', "M 54,82 Q 68,72 80,82");
        browRight.setAttribute('d', "M 120,82 Q 132,72 146,82");
        eyelidLeft.setAttribute('transform', 'translate(0, -34)');
        eyelidRight.setAttribute('transform', 'translate(0, -34)');
        mouth.setAttribute('d', mouthShapes.openSmile);
        armLeftGroup.style.transform = "rotate(-120deg) translate(-8px, -15px)";
        armRightGroup.style.transform = "rotate(120deg) translate(8px, -15px)";

        spawnConfetti(18);
        speak("7-DAY CHECK-IN STREAK! YOU'RE CRUSHING IT!");

      } else if (type === 'sassy') {
        browLeft.setAttribute('d', "M 54,84 Q 68,76 80,88");
        browRight.setAttribute('d', "M 120,94 Q 132,96 146,92");
        eyelidLeft.setAttribute('transform', 'translate(0, -16)');
        eyelidRight.setAttribute('transform', 'translate(0, -22)');
        mouth.setAttribute('d', mouthShapes.smirk);
        armLeftGroup.style.transform = "rotate(35deg) translate(15px, 0px)";
        armRightGroup.style.transform = "rotate(-35deg) translate(-15px, 0px)";

        speak("Late luteal phase? Time to take a nap and demand chocolate.");

      } else if (type === 'hug') {
        browLeft.setAttribute('d', "M 54,92 Q 68,84 80,88");
        browRight.setAttribute('d', "M 120,88 Q 132,84 146,92");
        eyelidLeft.setAttribute('transform', 'translate(0, -34)');
        eyelidRight.setAttribute('transform', 'translate(0, -34)');
        mouth.setAttribute('d', mouthShapes.happy);
        armLeftGroup.style.transform = "rotate(-60deg) translate(-10px, -5px)";
        armRightGroup.style.transform = "rotate(60deg) translate(10px, -5px)";

        spawnConfetti(8);
        speak("Tough day? Logged your rest day & sent a nudge to your partner.");

      } else if (type === 'fertile') {
        // Automatically switch to Stage 5 Deep Peel State & trigger fertile glow
        setPeelStage(5);
        fertileGlow.style.opacity = '0.85';

        browLeft.setAttribute('d', "M 54,90 Q 68,84 80,88");
        browRight.setAttribute('d', "M 120,88 Q 132,84 146,90");
        eyelidLeft.setAttribute('transform', 'translate(0, -34)');
        eyelidRight.setAttribute('transform', 'translate(0, -34)');
        mouth.setAttribute('d', mouthShapes.happy);
        
        armLeftGroup.style.transform = "rotate(-45deg) translate(-6px, -2px)";
        armRightGroup.style.transform = "rotate(45deg) translate(6px, -2px)";

        spawnConfetti(16);
        speak("🌸 Fertile Window Bloom! Fully exposed top ruby seeds!");
      }
    }
  </script>
</body>
